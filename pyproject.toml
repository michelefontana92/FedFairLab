[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedfairlab"
version = "0.1.0"
description = "Fairness-aware federated learning experiments with FedFairLAB aggregation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "FedFairLAB contributors" }
]
dependencies = [
  "click>=8.0.3",
  "entmax>=1.3",
  "icecream>=2.1.3",
  "numpy>=1.26,<3",
  "pandas>=2.2.3",
  "ray>=2.6.1",
  "scikit-learn>=1.4.1.post1",
  "torch>=2.2.2",
  "torchmetrics>=1.3.2",
  "tqdm>=4.66.2",
  "wandb>=0.19.0",
]

[project.scripts]
fedfairlab = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "scoring_utils", "debug_utils", "checkpoint_utils"]

[tool.setuptools.packages.find]
where = ["src"]
